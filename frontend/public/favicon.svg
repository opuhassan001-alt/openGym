<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7FF84" />
      <stop offset="100%" stop-color="#16B978" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A7FF84" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="#071A52" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#086972" stroke-width="2" />
  
  <!-- Dumbbell / Athletic Kinetic Emblem -->
  <g transform="translate(12, 12)" filter="url(#ogGlow)">
    <!-- Left Collar & Weight Plate -->
    <rect x="2" y="8" width="5" height="24" rx="2" fill="url(#ogGradient)" />
    <rect x="8" y="12" width="4" height="16" rx="1.5" fill="url(#ogGradient)" />
    
    <!-- Shaft / Handle -->
    <rect x="12" y="18" width="16" height="4" rx="2" fill="#FFFFFF" />
    <!-- Center Knurl -->
    <line x1="17" y1="18" x2="17" y2="22" stroke="#071A52" stroke-width="1" />
    <line x1="20" y1="18" x2="20" y2="22" stroke="#071A52" stroke-width="1" />
    <line x1="23" y1="18" x2="23" y2="22" stroke="#071A52" stroke-width="1" />
    
    <!-- Right Collar & Weight Plate -->
    <rect x="28" y="12" width="4" height="16" rx="1.5" fill="url(#ogGradient)" />
    <rect x="33" y="8" width="5" height="24" rx="2" fill="url(#ogGradient)" />
  </g>
</svg>

